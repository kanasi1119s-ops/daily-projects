<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フリーランス発注書メーカー</title>
<meta name="description" content="フリーランス新法の取引条件明示に必要な項目を入力して、発注書の雛形を作成。入力内容はブラウザ内で処理され、サーバーに送信されません。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>フリーランス発注書メーカー</h1>
  <p>取引条件の明示に必要な項目を入力して、発注書の雛形を作成します。入力内容はこのブラウザ内だけで処理され、外部に送信されません。</p>
</header>
<main>
  <form id="form" novalidate>
    <fieldset><legend>当事者</legend>
      <label>発注者(業務委託事業者)の名称<input name="clientName" autocomplete="off"></label>
      <label>受注者(フリーランス)の名称<input name="freelancerName" autocomplete="off"></label>
      <label>発注日<input type="date" name="orderDate"></label>
    </fieldset>
    <fieldset><legend>業務内容</legend>
      <label>業務(給付)の内容<textarea name="workContent" rows="4"></textarea></label>
      <label>納期(給付を受領する期日)<input type="date" name="deliveryDate"></label>
      <label>納品(提供)場所<input name="deliveryPlace" placeholder="例: メール納品 / 東京都〇〇"></label>
      <label class="inline"><input type="checkbox" name="hasInspection"> 検査を行う</label>
      <label id="inspectionRow" hidden>検査完了日<input type="date" name="inspectionDate"></label>
    </fieldset>
    <fieldset><legend>報酬・支払</legend>
      <label>報酬の決め方
        <select name="feeType"><option value="fixed">金額が確定している</option><option value="method">算定方法で定める</option></select>
      </label>
      <div id="feeFixed">
        <label>報酬額(円)<input type="number" name="feeAmount" min="1" step="1" inputmode="numeric"></label>
        <label class="inline"><input type="checkbox" name="taxIncluded" checked> 消費税込</label>
      </div>
      <label id="feeMethodRow" hidden>報酬額の算定方法<textarea name="feeMethod" rows="2" placeholder="例: 時給5,000円×稼働時間(月末締め)"></textarea></label>
      <label>支払期日<input type="date" name="paymentDate"></label>
      <label>支払方法
        <select name="paymentMethod"><option value="bank">銀行振込</option><option value="other">その他(現金以外)</option></select>
      </label>
      <label id="paymentDetailRow" hidden>支払方法の詳細<input name="paymentMethodDetail"></label>
      <label>備考(任意)<textarea name="notes" rows="2"></textarea></label>
    </fieldset>
    <button type="submit">発注書を作成</button>
  </form>
  <section aria-live="polite">
    <ul id="messages"></ul>
    <pre id="output" hidden></pre>
    <div id="actions" hidden>
      <button type="button" id="copy">コピー</button>
      <button type="button" id="print">印刷 / PDF保存</button>
    </div>
  </section>
</main>
<footer>
  <p>本ツールは雛形を生成するもので、法的助言ではありません。契約内容や法令適合性は、公正取引委員会・厚生労働省の公表資料等で確認し、必要に応じて専門家にご相談ください。</p>
</footer>
<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
