<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゼイクラベ｜インボイス消費税 納税額比較シミュレーター</title>
<meta name="description" content="本則課税・簡易課税・2割特例の消費税納税額を並べて比較できる無料の概算ツール。入力内容は端末内で計算され、送信・保存されません。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2713%27 font-size=%2714%27%3E%E7%A8%8E%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>ゼイクラベ</h1>
  <p>消費税の納税額を、方式別に並べて比べる概算ツール</p>
</header>
<main>
  <form id="form" novalidate>
    <label>課税売上（税込・年間・円）
      <input id="sales" type="text" inputmode="numeric" autocomplete="off" placeholder="例: 5,500,000" required>
    </label>
    <label>課税仕入・経費（税込・年間・円）
      <input id="purchases" type="text" inputmode="numeric" autocomplete="off" placeholder="例: 1,100,000" required>
    </label>
    <label>基準期間（前々年）の課税売上・税抜（円・任意）
      <input id="base" type="text" inputmode="numeric" autocomplete="off" placeholder="未入力なら当期売上から概算">
    </label>
    <label>業種区分（簡易課税）
      <select id="type"></select>
    </label>
    <label>対象の課税期間（暦年）
      <select id="year">
        <option value="2026">2026年分</option>
        <option value="2027" selected>2027年分</option>
        <option value="2028">2028年分以降</option>
      </select>
    </label>
    <label class="check"><input id="wasExempt" type="checkbox" checked> インボイス登録前は免税事業者だった</label>
    <button type="submit">比較する</button>
  </form>
  <p id="error" role="alert" hidden></p>
  <section id="result" aria-live="polite" hidden>
    <h2>試算結果</h2>
    <p id="summary"></p>
    <table>
      <thead><tr><th>方式</th><th>納税額（概算）</th><th>備考</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="small" id="meta"></p>
  </section>
  <section class="disclaimer">
    <h2>ご利用にあたって</h2>
    <ul>
      <li>本ツールは一般的な情報提供と概算を目的としたもので、税務上の助言ではありません。申告前に税務署・税理士へご確認ください。</li>
      <li>標準税率10%のみを前提にしています（軽減税率8%・売上返還・貸倒れ等は未対応）。</li>
      <li>制度は改正される場合があります。最新情報は<a href="https://www.nta.go.jp/" rel="noopener noreferrer">国税庁</a>で確認してください。</li>
      <li>入力値はブラウザ内でのみ計算され、外部へ送信・保存されません。</li>
    </ul>
  </section>
</main>
<script type="module" src="src/app.js"></script>
</body>
</html>
