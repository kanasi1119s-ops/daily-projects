<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>インボイス税額シミュレーター(2割・3割特例対応)</title>
<meta name="description" content="個人事業者向け。免税・本則・簡易課税・2割/3割特例の消費税額を比較。入力データは端末内で処理され、外部送信しません。">
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--card:#f5f7fa;--acc:#0b63ce;--ok:#0a7a3d;--bd:#d8dde3}
@media(prefers-color-scheme:dark){:root{--bg:#14171a;--fg:#e8eaed;--mut:#9aa0a6;--card:#1e2328;--acc:#6aa9ff;--ok:#56d18a;--bd:#333a41}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.5em 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:12px 0}
label{display:block;margin:10px 0 2px;font-weight:600}
input,select{width:100%;box-sizing:border-box;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.best{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok) inset}
.tax{font-size:1.3rem;font-weight:700}
.badge{background:var(--ok);color:#fff;border-radius:99px;padding:0 .6em;font-size:.8rem}
.mut{color:var(--mut);font-size:.9rem}
.warn{border-left:4px solid #d98b00}
</style>
</head>
<body>
<main>
<noscript><p>このツールの利用にはJavaScriptを有効にしてください。</p></noscript>
<h1>インボイス税額シミュレーター</h1>
<p class="mut">免税のまま/本則課税/簡易課税/2割・3割特例の消費税額を比較します。入力内容はこのブラウザ内でのみ計算され、送信・保存されません。</p>

<section class="card">
<label for="year">対象の年分</label>
<select id="year"><option value="2026">2026年分(2割特例)</option><option value="2027">2027年分(3割特例)</option><option value="2028">2028年分(3割特例)</option><option value="2029">2029年分(特例なし)</option></select>
<label for="sales">年間の課税売上(税抜・円)</label>
<input id="sales" type="number" inputmode="numeric" min="0" max="1000000000000" value="5000000">
<label for="purch">消費税がかかる仕入・経費(税込・円)</label>
<input id="purch" type="number" inputmode="numeric" min="0" max="1000000000000" value="1100000">
<label for="biz">簡易課税の事業区分</label>
<select id="biz">
<option value="1">第1種 卸売業(90%)</option><option value="2">第2種 小売業(80%)</option><option value="3">第3種 製造業等(70%)</option>
<option value="4">第4種 その他(60%)</option><option value="5" selected>第5種 サービス業等(50%)</option><option value="6">第6種 不動産業(40%)</option></select>
</section>

<section id="out" aria-live="polite"></section>

<section class="card">
<h2 style="font-size:1.1rem;margin:0">取引先の負担(免税のままの場合)</h2>
<label for="pay">取引先から受け取る年間の対価(税込・円)</label>
<input id="pay" type="number" inputmode="numeric" min="0" max="1000000000000" value="1100000">
<label for="ym">支払時期</label>
<input id="ym" type="month" value="2026-10">
<p id="burden"></p>
</section>

<section class="card warn mut">
<strong>ご注意</strong>:本ツールは一般的な目安を示すもので、税務上の助言ではありません。標準税率10%のみ・端数処理は切り捨て・事前届出や適用要件の判定は行いません。制度内容(特に3割特例の要件)は改正により変わるため、必ず国税庁の最新情報または税理士にご確認ください。
</section>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
