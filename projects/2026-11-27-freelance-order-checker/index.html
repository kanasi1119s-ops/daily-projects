<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>フリーランス法 発注チェッカー</title>
<meta name="description" content="発注書ひな形の作成・支払期日(60日)の計算・発注時のセルフ診断をブラウザ内だけで行う無料ツール(参考情報)">
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--ac:#0b5cad;--bd:#d8d8d8;--ng:#b3261e;--ok:#1b7a3e}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--mut:#aaa;--ac:#6cb2ff;--bd:#444;--ng:#ff8a80;--ok:#6fdc8c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}h1{font-size:1.4rem}
.warn{border:1px solid var(--bd);border-left:4px solid var(--ng);padding:8px 12px;font-size:.9rem}
nav{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}nav button{padding:8px 12px;border:1px solid var(--bd);background:none;color:var(--fg);border-radius:6px;cursor:pointer}
nav button[aria-selected=true]{background:var(--ac);color:var(--bg);border-color:var(--ac)}
label{display:block;margin:10px 0 2px;font-weight:600}input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
.btn{margin-top:12px;padding:10px 16px;border:0;background:var(--ac);color:var(--bg);border-radius:6px;cursor:pointer;font:inherit}
pre{white-space:pre-wrap;border:1px solid var(--bd);padding:12px;border-radius:6px}
.ng{color:var(--ng)}.ok{color:var(--ok)}[hidden]{display:none}footer{margin-top:32px;font-size:.85rem;color:var(--mut)}
fieldset{border:1px solid var(--bd);border-radius:6px;margin:8px 0}
</style></head><body><main>
<h1>フリーランス法 発注チェッカー</h1>
<p class="warn">本ツールは一般的な参考情報であり、法的助言ではありません。結果は適法性を保証しません。最新の条文・公正取引委員会等の公式資料で確認し、必要に応じて専門家へご相談ください。入力内容はブラウザ内で処理され、外部へ送信されません。</p>
<nav role="tablist"><button role="tab" data-t="sheet" aria-selected="true">発注書ひな形</button><button role="tab" data-t="pay" aria-selected="false">支払期日計算</button><button role="tab" data-t="diag" aria-selected="false">セルフ診断</button></nav>

<section id="sheet">
<form id="f">
<label>発注事業者の名称<input name="clientName"></label>
<label>フリーランスの名称<input name="freelancerName"></label>
<label>業務委託をした日<input type="date" name="orderDate"></label>
<label>業務内容<textarea name="description" rows="3"></textarea></label>
<label>納期<input type="date" name="deliveryDate"></label>
<label>納品場所<input name="deliveryPlace" placeholder="例: メールで電子納品"></label>
<label>報酬額<input name="amount" placeholder="例: 100,000円(税抜)"></label>
<label>支払期日<input type="date" name="paymentDate"></label>
<label>検査をしますか<select name="inspection"><option value="no">しない</option><option value="yes">する</option></select></label>
<label>検査完了日<input type="date" name="inspectionDate"></label>
<label>現金以外で支払いますか<select name="nonCash"><option value="no">いいえ</option><option value="yes">はい</option></select></label>
<label>支払方法(現金以外の場合)<input name="nonCashMethod"></label>
<button class="btn" type="submit">ひな形を作成</button>
</form>
<div id="sheetOut" hidden><p id="miss" class="ng"></p><pre id="txt"></pre><button class="btn" id="copy" type="button">コピー</button></div>
</section>

<section id="pay" hidden>
<label>納品物の受領日<input type="date" id="rd"></label>
<label>予定している支払期日<input type="date" id="pd"></label>
<button class="btn" id="calc" type="button">判定</button>
<p id="payOut" role="status"></p>
<p style="font-size:.9rem;color:var(--mut)">受領日を1日目として数え、60日目を上限として保守的に計算しています。再委託の特則など例外は反映していません。</p>
</section>

<section id="diag" hidden><form id="df"></form><button class="btn" id="run" type="button">診断する</button><div id="dOut" role="status"></div></section>
<footer>© フリーランス法 発注チェッカー(MVP) / 条番号はフリーランス法(特定受託事業者に係る取引の適正化等に関する法律)を指します。</footer>
</main><script type="module" src="app.js"></script></body></html>
