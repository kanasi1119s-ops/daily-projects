<h1>プライバシーについて(ドラフト)</h1>
<p class="muted">※公開前に運営者が内容と連絡先を確認・追記してください(docs/legal-review.md 参照)。</p>
<ul>
<li>入力した内容(サービス名・金額・日付・メモ)は、お使いのブラウザの localStorage にのみ保存されます。</li>
<li>運営者のサーバーへ送信・収集することはありません。アクセス解析や広告タグも設置していません。</li>
<li>ブラウザのデータを消去する、または「全データ削除」を押すと削除されます。</li>
<li>カレンダー(.ics)・CSV・JSONはお使いの端末上で生成され、ダウンロードされます。</li>
</ul>
