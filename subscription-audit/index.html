<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
<title>サブスク棚卸し</title>
<meta name="description" content="契約中のサブスクを月額・年額に換算し、更新日をカレンダーに登録。データは端末内にのみ保存されます。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>サブスク棚卸し</h1>
  <p class="lead">契約中のサブスクを書き出して、月額・年額に換算。更新日はカレンダー(.ics)に登録できます。<br>入力データはこの端末のブラウザ内にだけ保存され、外部には送信されません。</p>
</header>

<main>
  <section aria-labelledby="sum-h">
    <h2 id="sum-h">サマリー</h2>
    <div class="cards" id="summary" aria-live="polite"></div>
    <div id="upcoming"></div>
    <div id="candidates"></div>
  </section>

  <section aria-labelledby="form-h">
    <h2 id="form-h">サブスクを追加</h2>
    <form id="form" novalidate>
      <input type="hidden" id="f-id">
      <label>サービス名<input id="f-name" maxlength="100" required autocomplete="off"></label>
      <label>金額(円)<input id="f-amount" type="number" min="0" max="10000000" step="1" inputmode="numeric" required></label>
      <label>支払い周期
        <select id="f-cycle">
          <option value="monthly">毎月</option><option value="yearly">毎年</option>
          <option value="quarterly">3か月ごと</option><option value="weekly">毎週</option>
        </select></label>
      <label>請求日(直近の請求日、または次回の請求日)<input id="f-date" type="date" required></label>
      <label>利用頻度(1: ほぼ使っていない 〜 5: 毎日使う)
        <select id="f-usage"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label>
      <label>カテゴリ<select id="f-category"></select></label>
      <label>メモ(任意)<input id="f-memo" maxlength="500" autocomplete="off"></label>
      <div class="row">
        <button type="submit" id="f-submit">追加</button>
        <button type="button" id="f-cancel" hidden>編集をやめる</button>
      </div>
      <p id="form-error" class="error" role="alert"></p>
    </form>
  </section>

  <section aria-labelledby="list-h">
    <h2 id="list-h">一覧(次回請求日が近い順)</h2>
    <div class="row">
      <button type="button" id="b-sample">サンプルを入れてみる</button>
      <button type="button" id="b-ics">更新日をカレンダーへ(.ics)</button>
      <button type="button" id="b-csv">CSV出力</button>
      <button type="button" id="b-json">バックアップ(JSON)</button>
      <label class="file">バックアップを読み込む<input type="file" id="b-import" accept=".json,application/json"></label>
      <button type="button" id="b-clear" class="danger">全データ削除</button>
    </div>
    <p id="status" class="status" role="status"></p>
    <div class="table-wrap"><table>
      <thead><tr><th>サービス</th><th>料金</th><th>月額換算</th><th>次回請求日</th><th>利用頻度</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <p id="empty" class="muted">まだ登録がありません。上のフォームから追加するか、「サンプルを入れてみる」を押してください。</p>
  </section>
</main>

<footer>
  <p>本ツールは家計管理の目安を示すもので、節約額や効果を保証するものではありません。実際の料金・解約条件は各サービスの公式情報をご確認ください。</p>
  <p><a href="privacy.html">プライバシーについて</a></p>
</footer>
<script type="module" src="src/app.js"></script>
</body>
</html>
