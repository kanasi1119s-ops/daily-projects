<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>取引条件明示チェッカー</title>
<style>
:root{--bg:#f7f8fa;--fg:#1c2430;--card:#fff;--bd:#d9dee5;--ok:#1a7f4b;--ng:#c0392b;--wn:#b7791f;--ac:#2456d6}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--fg:#e6e9ee;--card:#1b212a;--bd:#333c48;--ok:#4cc38a;--ng:#ff7b6b;--wn:#f0b552;--ac:#7fa4ff}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,"Hiragino Sans",sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:16px;margin:12px 0}
label{display:block;font-weight:600;margin-top:10px}
input,textarea,select{width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
.hint{font-size:.85em;opacity:.75}
ul{list-style:none;padding:0}li{padding:6px 0;border-bottom:1px solid var(--bd)}
.missing,.invalid{color:var(--ng)}.warn{color:var(--wn)}.ok{color:var(--ok)}.optional{opacity:.6}
button{padding:8px 14px;border:0;border-radius:6px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
pre{white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:6px}
.notice{border-left:4px solid var(--wn);padding-left:12px}
</style>
</head>
<body>
<main>
<h1>取引条件明示チェッカー</h1>
<p class="notice">フリーランスへの業務委託で書面等に記載すべきとされる主な項目の抜け漏れを確認する簡易ツールです。法的助言ではありません。入力内容はブラウザ内でのみ処理され、送信・保存されません。最終確認は公正取引委員会・厚生労働省等の公式資料または専門家で行ってください。</p>
<form id="f" class="card" autocomplete="off">
  <label for="clientName">発注者の名称</label><input id="clientName">
  <label for="contractorName">受注者（フリーランス）の名称</label><input id="contractorName">
  <label for="orderDate">業務委託をした日</label><input id="orderDate" type="date">
  <label for="description">給付（業務）の内容</label><textarea id="description" rows="3"></textarea>
  <label for="deliveryDate">納期（受領／役務提供を受ける期日）</label><input id="deliveryDate" type="date">
  <label for="deliveryPlace">納品場所／方法</label><input id="deliveryPlace">
  <label for="inspectionDate">検査完了日（検査する場合のみ）</label><input id="inspectionDate" type="date">
  <label for="amount">報酬の額（円）</label><input id="amount" inputmode="numeric">
  <label for="taxIncluded">税区分</label>
  <select id="taxIncluded"><option value="">選択してください</option><option value="incl">税込</option><option value="excl">税抜</option></select>
  <label for="paymentDate">報酬の支払期日</label><input id="paymentDate" type="date">
  <label for="paymentMethod">現金以外の支払方法（該当する場合のみ）</label><input id="paymentMethod">
</form>
<section class="card" aria-live="polite"><h2>チェック結果</h2><p id="summary"></p><ul id="results"></ul></section>
<section class="card"><h2>発注書テキスト（雛形）</h2><pre id="out"></pre><button id="copy" type="button">コピー</button></section>
</main>
<script type="module" src="src/app.js"></script>
</body>
</html>
