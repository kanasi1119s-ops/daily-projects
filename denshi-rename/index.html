<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>電帳法ファイル名ツール</title>
<meta name="description" content="電子取引データのファイル名を「日付_取引先_金額」に揃え、検索台帳CSVとあわせてZIPで保存。ファイルは外部に送信されません。">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>電帳法ファイル名ツール</h1>
  <p class="lead">請求書・領収書のPDF等を「日付_取引先_金額」に揃えて、検索台帳CSVと一緒にZIP保存。<strong>ファイルはブラウザの外に送信されません。</strong></p>
</header>
<main>
  <section id="drop" tabindex="0" aria-label="ファイルを選択">
    <p>ここにファイルをドロップ、または</p>
    <label class="btn">ファイルを選ぶ<input id="picker" type="file" multiple hidden></label>
  </section>
  <section id="listSection" hidden>
    <div class="table-wrap">
      <table>
        <thead><tr><th>元ファイル</th><th>取引年月日</th><th>取引先</th><th>金額(円)</th><th>書類種別</th><th>備考</th><th>新ファイル名</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="actions">
      <button id="dl" class="btn primary" disabled>ZIPをダウンロード</button>
      <button id="clear" class="btn">クリア</button>
      <span id="status" role="status"></span>
    </div>
  </section>
</main>
<footer>
  <p>※本ツールは入力内容に沿ってファイル名を付けるだけの補助ツールです。電子帳簿保存法の要件充足（真実性・可視性の確保、事務処理規程等）を保証するものではありません。最終確認は税理士・所轄税務署等へ。</p>
  <p>金額・日付は書類の記載どおりに入力してください。同名ファイルには _2, _3 を付与します。</p>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
