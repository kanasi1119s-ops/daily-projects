<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>サブスクキーパー</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%277%27 fill=%27%232f6fed%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>サブスクキーパー</h1>
  <p class="lead">契約中のサブスクを年額で見える化。データはこのブラウザ内だけに保存され、外部へ送信されません。</p>
</header>
<main>
  <section class="cards" aria-label="合計">
    <div class="card"><span>月額合計</span><strong id="t-month">¥0</strong></div>
    <div class="card"><span>年額合計</span><strong id="t-year">¥0</strong></div>
    <div class="card"><span>契約数</span><strong id="t-count">0</strong></div>
  </section>

  <section>
    <h2>30日以内の支払い</h2>
    <ul id="upcoming" class="list"></ul>
  </section>

  <section>
    <h2>カテゴリ別（月額）</h2>
    <div id="cats"></div>
  </section>

  <section>
    <h2 id="form-title">サブスクを追加</h2>
    <form id="form" novalidate>
      <input type="hidden" id="f-id">
      <label>サービス名<input id="f-name" required maxlength="60"></label>
      <label>金額（円）<input id="f-amount" type="number" min="0" step="1" required></label>
      <label>支払い周期<select id="f-cycle"></select></label>
      <label>次回（または直近の）支払日<input id="f-date" type="date" required></label>
      <label>カテゴリ<select id="f-cat"></select></label>
      <label>メモ<input id="f-note" maxlength="120"></label>
      <div class="row">
        <button type="submit" id="f-submit">追加</button>
        <button type="button" id="f-cancel" class="sec" hidden>編集をやめる</button>
      </div>
      <p id="f-err" class="err" role="alert"></p>
    </form>
  </section>

  <section>
    <h2>登録一覧</h2>
    <ul id="all" class="list"></ul>
  </section>

  <section>
    <h2>書き出し・読み込み</h2>
    <div class="row">
      <button id="b-ics" class="sec" type="button">カレンダー(.ics)</button>
      <button id="b-csv" class="sec" type="button">CSV書き出し</button>
      <button id="b-pick" class="sec" type="button">CSV読み込み</button><input id="b-import" type="file" accept=".csv,text/csv" hidden>
      <button id="b-clear" class="danger" type="button">全データ削除</button>
    </div>
    <p id="io-msg" class="note" role="status" aria-live="polite"></p>
    <p class="note">.icsを取り込むと、各サービスの次回支払日の3日前に通知が出ます（カレンダーアプリ側の設定に依存）。</p>
  </section>
</main>
<footer>
  <p>金額は入力値に基づく単純な換算です（為替・税・日割り等は考慮しません）。実際の請求は各サービスでご確認ください。</p>
</footer>
<script type="module" src="src/app.js"></script>
</body>
</html>
