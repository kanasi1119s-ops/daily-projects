name: invoice-tax-sim
on:
  push:
    paths: ['invoice-tax-sim/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: invoice-tax-sim } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm test
