name: invoice-tax-sim
on:
  push:
    paths: ["invoice-tax-sim/**"]
  pull_request:
    paths: ["invoice-tax-sim/**"]
jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: invoice-tax-sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: invoice-tax-sim/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
