name: torite-checker
on:
  push:
    paths: ["torite-checker/**"]
jobs:
  ci:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: torite-checker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: torite-checker/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
