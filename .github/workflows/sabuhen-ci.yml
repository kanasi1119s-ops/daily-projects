name: sabuhen CI
on:
  push:
    paths: ["sabuhen/**"]
  pull_request:
    paths: ["sabuhen/**"]
jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sabuhen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sabuhen/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
