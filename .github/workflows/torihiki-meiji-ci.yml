name: ci
on:
  push:
    paths: ['projects/2026-10-07-torihiki-meiji/**']
  pull_request:
    paths: ['projects/2026-10-07-torihiki-meiji/**']
defaults:
  run:
    working-directory: projects/2026-10-07-torihiki-meiji
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: npm run build
