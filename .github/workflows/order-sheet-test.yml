name: order-sheet-generator test
on:
  push:
    paths: ['order-sheet-generator/**']
  pull_request:
    paths: ['order-sheet-generator/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test
        working-directory: order-sheet-generator
