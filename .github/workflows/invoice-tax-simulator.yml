name: invoice-tax-simulator
on:
  push:
    paths: ["invoice-tax-simulator/**"]
  pull_request:
    paths: ["invoice-tax-simulator/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: invoice-tax-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
