name: subscan-ci
on:
  push:
    paths: ['2026-11-04-subscan/**']
  pull_request:
    paths: ['2026-11-04-subscan/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 2026-11-04-subscan } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
