name: freelance-act-checker
on:
  push:
    paths: ['freelance-act-checker/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
        working-directory: freelance-act-checker
