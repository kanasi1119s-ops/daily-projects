name: freelance-terms-generator
on:
  push:
    paths: ['freelance-terms-generator/**']
  pull_request:
    paths: ['freelance-terms-generator/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: freelance-terms-generator } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: npm run build
