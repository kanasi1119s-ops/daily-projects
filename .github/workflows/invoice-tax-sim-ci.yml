name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: projects/invoice-tax-sim } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: projects/invoice-tax-sim/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
