name: denchou-renamer
on:
  push:
    paths: ['projects/denchou-renamer/**']
  pull_request:
    paths: ['projects/denchou-renamer/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/denchou-renamer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
