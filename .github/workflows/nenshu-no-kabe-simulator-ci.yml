name: CI

on:
  push:
    paths:
      - 'projects/2026-09-24-nenshu-no-kabe-simulator/**'
  pull_request:
    paths:
      - 'projects/2026-09-24-nenshu-no-kabe-simulator/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/2026-09-24-nenshu-no-kabe-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test
      - run: npm run build
