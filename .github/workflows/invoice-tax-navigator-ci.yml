name: invoice-tax-navigator CI
on:
  push:
    paths: ["invoice-tax-navigator/**"]
  pull_request:
    paths: ["invoice-tax-navigator/**"]
defaults:
  run:
    working-directory: invoice-tax-navigator
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: invoice-tax-navigator/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
