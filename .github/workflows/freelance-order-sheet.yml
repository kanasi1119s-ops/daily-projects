name: freelance-order-sheet
on:
  push:
    paths: ['freelance-order-sheet/**']
  pull_request:
    paths: ['freelance-order-sheet/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: freelance-order-sheet } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: npm run build
