name: zeikurabe-ci
on:
  push:
    paths: ['projects/zeikurabe/**']
  pull_request:
    paths: ['projects/zeikurabe/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/zeikurabe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
