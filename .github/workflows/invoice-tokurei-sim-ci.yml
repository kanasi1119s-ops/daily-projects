name: ci
on:
  push:
    paths: ['invoice-tokurei-sim/**']
  pull_request:
    paths: ['invoice-tokurei-sim/**']
defaults:
  run:
    working-directory: invoice-tokurei-sim
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: invoice-tokurei-sim/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
